<script>
        const eventSelect = document.getElementById('event_id');
        const amountInput = document.getElementById('total_amount');

        function updateAmount() {
            const value = eventSelect.selectedOptions[0].dataset.total;
            amountInput.value = value === '' ? '' : Number(value).toFixed(2);
        }

        eventSelect.addEventListener('change', updateAmount);

        if (!amountInput.value) {
            updateAmount();
        }
    </script>
