    <script>
        const venue = document.getElementById('venue_id');
        const menu = document.getElementById('menu_id');
        const guests = document.getElementById('guest_count');
        const total = document.getElementById('estimated_total');

        function updateTotal() {
            const venuePrice = Number(venue.selectedOptions[0].dataset.price || 0);
            const menuPrice = Number(menu.selectedOptions[0].dataset.price || 0);
            total.textContent = '$' + (venuePrice + menuPrice * Number(guests.value || 0)).toFixed(2);
        }

        venue.addEventListener('change', updateTotal);
        menu.addEventListener('change', updateTotal);
        guests.addEventListener('input', updateTotal);

        updateTotal();
    </script>
